spring.application.name=phishing-detector-api
safebrowsing.api.key=${SAFEBROWSING_API_KEY}
gemini.api.key=${GEMINI_API_KEY}
server.port=${PORT:8080}
whois.api.key=${WHOIS_API_KEY}
urlhaus.api.key=${URLHAUS_API_KEY}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000

# Mail (Gmail API over HTTPS, since Render blocks outbound SMTP ports)
spring.mail.username=${MAIL_USERNAME}
gmail.client-id=${GMAIL_CLIENT_ID}
gmail.client-secret=${GMAIL_CLIENT_SECRET}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN}

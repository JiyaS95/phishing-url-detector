<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #0a0a14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo { font-size: 56px; margin-bottom: 12px; }

        h1 {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .subtitle { font-size: 15px; color: #666; }

        .box {
            background: #13131f;
            border: 1px solid #1e1e32;
            border-radius: 16px;
            padding: 40px;
            width: 620px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #1e1e2e;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab.active {
            background: #4f46e5;
            color: #fff;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            font-size: 14px;
            border: 1px solid #2a2a40;
            border-radius: 10px;
            background: #0d0d1a;
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }

        input:focus { border-color: #4f46e5; }
        input::placeholder { color: #444; }

        textarea {
            width: 100%;
            height: 160px;
            padding: 14px 18px;
            font-size: 14px;
            border: 1px solid #2a2a40;
            border-radius: 10px;
            background: #0d0d1a;
            color: #fff;
            outline: none;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 16px;
            transition: border 0.2s;
        }

        textarea:focus { border-color: #4f46e5; }
        textarea::placeholder { color: #444; }

        button {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 700;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button:hover { background: #4338ca; }

        .full-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 24px;
        }

        .error {
            color: #f87171;
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            background: #2a0a0a;
            border-radius: 8px;
            border-left: 3px solid #f87171;
        }

        .result-card {
            background: #0d0d1a;
            border: 1px solid #1e1e32;
            border-radius: 12px;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .risk-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .risk-LOW    { background: #14532d; color: #4ade80; }
        .risk-MEDIUM { background: #713f12; color: #fbbf24; }
        .risk-HIGH   { background: #7f1d1d; color: #f87171; }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .meta-item {
            background: #13131f;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .meta-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 13px;
            color: #ccc;
            word-break: break-all;
        }

        .score-bar-wrap { margin-bottom: 16px; }

        .score-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .score-bar {
            height: 6px;
            background: #1e1e32;
            border-radius: 3px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        .warnings-title {
            font-size: 12px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .warnings-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .warnings-list li {
            font-size: 13px;
            padding: 8px 12px;
            background: #13131f;
            border-radius: 8px;
            border-left: 3px solid #4f46e5;
            color: #ccc;
            line-height: 1.4;
        }

        .no-warnings {
            font-size: 14px;
            color: #4ade80;
            text-align: center;
            padding: 12px;
            background: #0a2a0a;
            border-radius: 8px;
        }

        .loading {
            color: #666;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #333;
        }
    </style>
</head>
<script>
    // Tab switching
    function switchTab(tab) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
        document.getElementById("tab-" + tab).classList.add("active");
        document.querySelector("[data-tab='" + tab + "']").classList.add("active");
    }

    function getRiskLevel(riskLevel) {
        if (!riskLevel) return "LOW";
        if (riskLevel.includes("HIGH")) return "HIGH";
        if (riskLevel.includes("MEDIUM")) return "MEDIUM";
        return "LOW";
    }

    function renderWarnings(warnings) {
        if (!warnings || warnings.length === 0) {
            return "<div class='no-warnings'>✅ No threats detected</div>";
        }
        var html = "<div class='warnings-title'>Warnings</div><ul class='warnings-list'>";
        for (var i = 0; i < warnings.length; i++) {
            html += "<li>" + warnings[i] + "</li>";
        }
        html += "</ul>";
        return html;
    }

    function renderScoreBar(score, color) {
        return "<div class='score-bar-wrap'>" +
            "<div class='score-label'><span>Risk Score</span><span>" + score + "/100</span></div>" +
            "<div class='score-bar'><div class='score-fill' style='width:" + score + "%;background:" + color + "'></div></div>" +
            "</div>";
    }

    // URL Check
    function checkURL() {
        var url = document.getElementById("urlInput").value;
        if (url == "") {
            document.getElementById("urlResult").innerHTML = "<div class='error'>Please enter a URL</div>";
            return;
        }
        document.getElementById("urlResult").innerHTML = "<div class='loading'>Analyzing...</div>";

        fetch("/check?url=" + encodeURIComponent(url))
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.error) {
                    document.getElementById("urlResult").innerHTML = "<div class='error'>" + data.error + "</div>";
                    return;
                }
                var level = getRiskLevel(data.riskLevel);
                var barColor = level === "HIGH" ? "#f87171" : level === "MEDIUM" ? "#fbbf24" : "#4ade80";
                var html = "<div class='result-card'>";
                html += "<span class='risk-badge risk-" + level + "'>" + (data.riskLevel || "LOW") + "</span>";
                html += renderScoreBar(data.riskScore, barColor);
                html += "<div class='meta-grid'>";
                html += "<div class='meta-item'><div class='meta-label'>Protocol</div><div class='meta-value'>" + (data.protocol || "-") + "</div></div>";
                html += "<div class='meta-item'><div class='meta-label'>Domain</div><div class='meta-value'>" + (data.domain || "-") + "</div></div>";
                if (data.path) html += "<div class='meta-item' style='grid-column:span 2'><div class='meta-label'>Path</div><div class='meta-value'>" + data.path + "</div></div>";
                html += "</div>";
                html += renderWarnings(data.warnings);
                html += "</div>";
                document.getElementById("urlResult").innerHTML = html;
            });
    }

    // Email Check
    function checkEmail() {
        var body = document.getElementById("emailInput").value;
        if (body.trim() == "") {
            document.getElementById("emailResult").innerHTML = "<div class='error'>Please paste email content</div>";
            return;
        }
        document.getElementById("emailResult").innerHTML = "<div class='loading'>Analyzing...</div>";

        fetch("/check-email", {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: body
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
            if (data.error) {
                document.getElementById("emailResult").innerHTML = "<div class='error'>" + data.error + "</div>";
                return;
            }
            var level = getRiskLevel(data.riskLevel);
            var barColor = level === "HIGH" ? "#f87171" : level === "MEDIUM" ? "#fbbf24" : "#4ade80";
            var html = "<div class='result-card'>";
            html += "<span class='risk-badge risk-" + level + "'>" + (data.riskLevel || "LOW") + "</span>";
            html += renderScoreBar(data.riskScore, barColor);
            html += renderWarnings(data.warnings);
            if (data.suspiciousUrls && data.suspiciousUrls.length > 0) {
                html += "<div class='warnings-title' style='margin-top:12px'>Suspicious URLs Found</div><ul class='warnings-list'>";
                for (var i = 0; i < data.suspiciousUrls.length; i++) {
                    html += "<li>" + data.suspiciousUrls[i] + "</li>";
                }
                html += "</ul>";
            }
            if (data.aiAnalysis) {
                html += "<div style='margin-top:12px;padding:12px;background:#0a0a1a;border-radius:8px;border-left:3px solid #4f46e5;'>";
                html += "<div class='meta-label' style='margin-bottom:6px;'>🤖 AI Analysis</div>";
                html += "<div style='font-size:13px;color:#ccc;line-height:1.6;'>" + data.aiAnalysis + "</div>";
                html += "</div>";
            }
            html += "</div>";
            document.getElementById("emailResult").innerHTML = html;
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("urlInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") checkURL();
        });
    });
</script>
<body>
    <div class="header">
        <div class="logo">🛡️</div>
        <h1>Phishing Detector</h1>
        <p class="subtitle">Check any URL or email for phishing indicators and risk assessment</p>
    </div>

    <div class="box">
        <div class="tabs">
            <button class="tab active" data-tab="url" onclick="switchTab('url')">🔗 URL Check</button>
            <button class="tab" data-tab="email" onclick="switchTab('email')">📧 Email Check</button>
        </div>

        <div id="tab-url" class="tab-content active">
            <div class="input-row">
                <input type="text" id="urlInput" placeholder="https://example.com">
                <button onclick="checkURL()">Analyze</button>
            </div>
            <div id="urlResult"></div>
        </div>

        <div id="tab-email" class="tab-content">
            <textarea id="emailInput" placeholder="Paste email content here..."></textarea>
            <button class="full-btn" onclick="checkEmail()">Analyze Email</button>
            <div id="emailResult"></div>
        </div>
    </div>

    <p class="footer">Powered by Google Safe Browsing & URLhaus</p>
</body>
</html>

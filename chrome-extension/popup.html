<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alurtra</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="Alurtra logo" style="width:48px;height:48px;object-fit:contain;">
      <h1>Alurtra</h1>
      <p class="subtitle">URL & Email Risk Analyzer</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="url">URL Check</button>
      <button class="tab" data-tab="email">Email Check</button>
    </div>

    <div id="tab-url" class="tab-content active">
      <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://example.com" />
        <button id="checkUrl">Analyze</button>
      </div>
      <div id="urlResult" class="result hidden"></div>
    </div>

    <div id="tab-email" class="tab-content">
      <div class="input-group column">
        <textarea id="emailInput" placeholder="Paste email content here..."></textarea>
        <button id="checkEmail">Analyze Email</button>
      </div>
      <div id="emailResult" class="result hidden"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
